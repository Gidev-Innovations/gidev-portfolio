name: Build and Deploy React to R2

on:
  push:
    branches:
      - main  # deploy on merges to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3) Install dependencies inside portfolio/
      - name: Install dependencies
        run: npm ci
        working-directory: portfolio

      # 4) Build React project inside portfolio/
      - name: Build React app
        run: npm run build
        working-directory: portfolio

      # 5) Install MinIO client
      - name: Install MinIO Client
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      # 6) Configure R2 alias with S3v4
      - name: Configure mc alias
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mc alias set myr2 "${R2_ENDPOINT}" "${R2_ACCESS_KEY}" "${R2_SECRET}" --api S3v4

      # 7) Deploy build folder to R2 bucket
      - name: Deploy to Bucket
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mc mirror ./portfolio/build "myr2/${R2_BUCKET}/" --overwrite --remove
